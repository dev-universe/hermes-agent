name: Hermes canary image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex Hermes commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  SOURCE_REPOSITORY: https://github.com/dev-universe/hermes-agent.git
  IMAGE_REPOSITORY: ghcr.io/dev-universe/hermes-agent-canary
  SOURCE_SHA: ${{ inputs.source_sha }}
  IMAGE_REF: ghcr.io/dev-universe/hermes-agent-canary:sha-${{ inputs.source_sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.capture_digest.outputs.image_ref }}
      image_digest: ${{ steps.capture_digest.outputs.image_digest }}
      image_digest_ref: ${{ steps.capture_digest.outputs.image_digest_ref }}
      build_metadata_ref: ${{ steps.capture_digest.outputs.build_metadata_ref }}
    steps:
      - name: Validate source SHA
        id: validate_source_sha
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          source_sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('source_sha must be a 40-hex lowercase commit SHA')
          PY

      - name: Initialize build artifact workspace
        id: init_artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts hermes-source

      - name: Checkout trusted hardening recipe
        id: checkout_recipe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Log in to GHCR
        id: login_ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone exact Hermes source
        id: clone_source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags "$SOURCE_REPOSITORY" hermes-source
          git -C hermes-source checkout --force "$SOURCE_SHA"
          actual_source_sha="$(git -C hermes-source rev-parse HEAD)"
          if [ "$actual_source_sha" != "$SOURCE_SHA" ]; then
            echo "::error::checked out $actual_source_sha, expected $SOURCE_SHA"
            exit 1
          fi
          printf '%s\n' "$actual_source_sha" > artifacts/source-sha.txt

      - name: Render dashboard-only canary Dockerfile
        id: render_canary_dockerfile
        shell: bash
        run: |
          set -euo pipefail
          python3 workflow-source/.github/scripts/render_dashboard_canary_dockerfile.py \
            --source hermes-source/Dockerfile \
            --fragment workflow-source/.github/docker/dashboard-canary.fragment \
            --output hermes-source/Dockerfile.canary \
            --artifact-dir artifacts

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action@v3

      - name: Build and push Hermes canary image
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action@v6
        with:
          context: ./hermes-source
          file: ./hermes-source/Dockerfile.canary
          target: dashboard_canary
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/dev-universe/hermes-agent
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.title=Hermes canary image
          build-args: |
            HERMES_GIT_SHA=${{ inputs.source_sha }}
          provenance: true

      - name: Capture build metadata and digest
        id: capture_digest
        if: always()
        shell: bash
        env:
          BUILD_IMAGE_METADATA: ${{ steps.build_image.outputs.metadata }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re

          artifact_dir = pathlib.Path('artifacts')
          artifact_dir.mkdir(parents=True, exist_ok=True)

          image_ref = os.environ['IMAGE_REF']
          metadata = os.environ['BUILD_IMAGE_METADATA'].strip()
          if not metadata:
              raise SystemExit('build image metadata missing')
          (artifact_dir / 'build-metadata.json').write_text(metadata + '\n', encoding='utf-8')

          digest = ''
          try:
              parsed = json.loads(metadata)
          except json.JSONDecodeError:
              parsed = {}
          if isinstance(parsed, dict):
              for key in ('containerimage.digest', 'image.digest', 'digest'):
                  value = parsed.get(key)
                  if isinstance(value, str) and value:
                      digest = value
                      break
          if not digest:
              match = re.search(r'sha256:[0-9a-f]{64}', metadata)
              if match:
                  digest = match.group(0)
          if not digest:
              raise SystemExit('could not find a container digest in build metadata')
          if not digest.startswith('sha256:'):
              digest = f'sha256:{digest}'

          image_digest_ref = f'{image_ref}@{digest}'
          (artifact_dir / 'image-digest.txt').write_text(image_digest_ref + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'image_ref={image_ref}\n')
              handle.write(f'image_digest={digest}\n')
              handle.write(f'image_digest_ref={image_digest_ref}\n')
              handle.write('build_metadata_ref=artifacts/build-metadata.json\n')
          PY

      - name: Write build status
        id: write_build_status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          VALIDATE_SOURCE_SHA_OUTCOME: ${{ steps.validate_source_sha.outcome }}
          INIT_ARTIFACTS_OUTCOME: ${{ steps.init_artifacts.outcome }}
          CHECKOUT_RECIPE_OUTCOME: ${{ steps.checkout_recipe.outcome }}
          LOGIN_GHCR_OUTCOME: ${{ steps.login_ghcr.outcome }}
          CLONE_SOURCE_OUTCOME: ${{ steps.clone_source.outcome }}
          RENDER_CANARY_DOCKERFILE_OUTCOME: ${{ steps.render_canary_dockerfile.outcome }}
          SETUP_BUILDX_OUTCOME: ${{ steps.setup_buildx.outcome }}
          BUILD_IMAGE_OUTCOME: ${{ steps.build_image.outcome }}
          CAPTURE_DIGEST_OUTCOME: ${{ steps.capture_digest.outcome }}
          BUILD_METADATA_REF: ${{ steps.capture_digest.outputs.build_metadata_ref }}
          IMAGE_DIGEST_REF: ${{ steps.capture_digest.outputs.image_digest_ref }}
          SOURCE_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          outcomes = [
              ('validate_source_sha', os.environ['VALIDATE_SOURCE_SHA_OUTCOME']),
              ('init_artifacts', os.environ['INIT_ARTIFACTS_OUTCOME']),
              ('checkout_recipe', os.environ['CHECKOUT_RECIPE_OUTCOME']),
              ('login_ghcr', os.environ['LOGIN_GHCR_OUTCOME']),
              ('clone_source', os.environ['CLONE_SOURCE_OUTCOME']),
              ('render_canary_dockerfile', os.environ['RENDER_CANARY_DOCKERFILE_OUTCOME']),
              ('setup_buildx', os.environ['SETUP_BUILDX_OUTCOME']),
              ('build_image', os.environ['BUILD_IMAGE_OUTCOME']),
              ('capture_digest', os.environ['CAPTURE_DIGEST_OUTCOME']),
          ]
          failure_stage = next((name for name, outcome in outcomes if outcome != 'success'), '')
          status = {
              'schema_version': 1,
              'job_name': 'build',
              'job_status': os.environ['JOB_STATUS'],
              'failure_stage': failure_stage,
              'source_repository': os.environ['SOURCE_REPOSITORY'],
              'source_sha': os.environ['SOURCE_SHA'],
              'image_repository': os.environ['IMAGE_REPOSITORY'],
              'image_ref': os.environ['IMAGE_REF'],
              'image_digest_ref': os.environ['IMAGE_DIGEST_REF'],
              'step_outcomes': {name: outcome for name, outcome in outcomes},
              'artifacts': {
                  'digest': 'artifacts/image-digest.txt',
                  'source_sha': 'artifacts/source-sha.txt',
                  'source_dockerfile_sha256': 'artifacts/source-dockerfile.sha256',
                  'hardening_fragment_sha256': 'artifacts/hardening-fragment.sha256',
                  'rendered_dockerfile_sha256': 'artifacts/rendered-dockerfile.sha256',
                  'build_metadata': os.environ['BUILD_METADATA_REF'],
                  'status': 'artifacts/build-status.json',
              },
              'policy': {
                  'platform': 'linux/amd64',
                  'full_source_image': True,
                  'mutable_tags': False,
              },
          }
          Path('artifacts/build-status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload build artifacts
        id: upload_build_artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: hermes-canary-image-build-${{ inputs.source_sha }}
          path: |
            artifacts/image-digest.txt
            artifacts/source-sha.txt
            artifacts/source-dockerfile.sha256
            artifacts/hardening-fragment.sha256
            artifacts/rendered-dockerfile.sha256
            artifacts/build-metadata.json
            artifacts/build-status.json
          if-no-files-found: warn

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST_REF: ${{ needs.build.outputs.image_digest_ref }}
    steps:
      - name: Initialize smoke artifact workspace
        run: mkdir -p artifacts

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dashboard-only runtime
        id: runtime_smoke
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_DIGEST_REF"
          docker run --rm "$IMAGE_DIGEST_REF" --help >/dev/null
          docker run --init --rm "$IMAGE_DIGEST_REF" --help >/dev/null
          docker run --rm "$IMAGE_DIGEST_REF" dashboard --help >/dev/null
          docker run --rm --entrypoint /bin/sh "$IMAGE_DIGEST_REF" -c \
            'test "$(dpkg-query -W -f="\${Version}" util-linux)" = "2.41.5-0+deb13u1" && test "$(dpkg-query -W -f="\${Version}" libcap2)" = "1:2.75-10+deb13u1+b1" && test ! -e /opt/hermes/node_modules && ! command -v npm && ! command -v npx && ! command -v node && ! command -v uv && ! command -v uvx && /opt/hermes/.venv/bin/python -c '\''import tornado; assert tornado.version == "6.5.8"'\'''

          export HERMES_DASHBOARD_BASIC_AUTH_USERNAME=ci-smoke
          export HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="$(openssl rand -hex 32)"
          export HERMES_DASHBOARD_BASIC_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
          echo "::add-mask::$HERMES_DASHBOARD_BASIC_AUTH_SECRET"
          container_id=""
          cleanup() {
            status=$?
            if [ -n "${container_id:-}" ]; then
              if [ "$status" -ne 0 ]; then
                docker inspect --format \
                  'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{json .State.Error}}' \
                  "$container_id" || true
                docker top "$container_id" -eo pid,ppid,user,stat,comm,args 2>&1 || true
              fi
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            return "$status"
          }
          trap cleanup EXIT
          container_id="$(docker run -d --rm \
            -p 127.0.0.1:19119:9119 \
            -e HERMES_DASHBOARD_BASIC_AUTH_USERNAME \
            -e HERMES_DASHBOARD_BASIC_AUTH_PASSWORD \
            -e HERMES_DASHBOARD_BASIC_AUTH_SECRET \
            "$IMAGE_DIGEST_REF" dashboard \
              --host 0.0.0.0 --port 9119 --no-open)"
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19119/api/status >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:19119/api/sessions)"
          [ "$code" = 401 ]
          printf 'dashboard_status=200\nunauth_sessions=401\n' > artifacts/runtime-smoke.txt

      - name: Write smoke status
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          outcome = os.environ['SMOKE_OUTCOME']
          pathlib.Path('artifacts/smoke-status.json').write_text(
              json.dumps({'job_name': 'smoke', 'outcome': outcome,
                          'failure_stage': '' if outcome == 'success' else 'runtime_smoke'},
                         indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: hermes-canary-image-smoke-${{ inputs.source_sha }}
          path: artifacts/*
          if-no-files-found: warn

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST_REF: ${{ needs.build.outputs.image_digest_ref }}
    steps:
      - name: Initialize SBOM artifact workspace
        id: init_artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Log in to GHCR
        id: login_ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SBOM artifact paths
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'spdx_path=%s\n' "artifacts/hermes.spdx.json"
            printf 'cyclonedx_path=%s\n' "artifacts/hermes.cyclonedx.json"
            printf 'sbom_status_path=%s\n' "artifacts/sbom-status.json"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Hermes SPDX SBOM
        id: hermes_spdx
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_DIGEST_REF }}
          format: spdx-json
          output-file: ${{ steps.prep.outputs.spdx_path }}
          upload-artifact: false

      - name: Generate Hermes CycloneDX SBOM
        id: hermes_cyclonedx
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_DIGEST_REF }}
          format: cyclonedx-json
          output-file: ${{ steps.prep.outputs.cyclonedx_path }}
          upload-artifact: false

      - name: Write SBOM status
        id: write_sbom_status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          LOGIN_GHCR_OUTCOME: ${{ steps.login_ghcr.outcome }}
          PREP_OUTCOME: ${{ steps.prep.outcome }}
          HERMES_SPDX_OUTCOME: ${{ steps.hermes_spdx.outcome }}
          HERMES_CYCLONEDX_OUTCOME: ${{ steps.hermes_cyclonedx.outcome }}
          IMAGE_DIGEST_REF: ${{ needs.build.outputs.image_digest_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          outcomes = [
              ('login_ghcr', os.environ['LOGIN_GHCR_OUTCOME']),
              ('prep', os.environ['PREP_OUTCOME']),
              ('hermes_spdx', os.environ['HERMES_SPDX_OUTCOME']),
              ('hermes_cyclonedx', os.environ['HERMES_CYCLONEDX_OUTCOME']),
          ]
          failure_stage = next((name for name, outcome in outcomes if outcome != 'success'), '')
          status = {
              'schema_version': 1,
              'job_name': 'sbom',
              'job_status': os.environ['JOB_STATUS'],
              'build_job_result': os.environ['BUILD_JOB_RESULT'],
              'failure_stage': failure_stage,
              'image_digest_ref': os.environ['IMAGE_DIGEST_REF'],
              'step_outcomes': {name: outcome for name, outcome in outcomes},
              'artifacts': {
                  'status': 'artifacts/sbom-status.json',
                  'spdx': 'artifacts/hermes.spdx.json',
                  'cyclonedx': 'artifacts/hermes.cyclonedx.json',
              },
          }
          Path('artifacts/sbom-status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload SBOM artifacts
        id: upload_sbom_artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: hermes-canary-image-sbom-${{ inputs.source_sha }}
          path: |
            artifacts/hermes.spdx.json
            artifacts/hermes.cyclonedx.json
            artifacts/sbom-status.json
          if-no-files-found: warn

  security:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST_REF: ${{ needs.build.outputs.image_digest_ref }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      BUILD_METADATA_REF: ${{ needs.build.outputs.build_metadata_ref }}
      SOURCE_REPOSITORY: https://github.com/dev-universe/hermes-agent.git
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_REPOSITORY: ghcr.io/dev-universe/hermes-agent-canary
    steps:
      - name: Initialize security artifact workspace
        id: init_artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Log in to GHCR
        id: login_ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout trusted workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare security artifact paths
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'vuln_json_path=%s\n' "artifacts/trivy-vuln.json"
            printf 'secret_json_path=%s\n' "artifacts/trivy-secret.json"
            printf 'security_status_path=%s\n' "artifacts/security-status.json"
            printf 'manifest_path=%s\n' "artifacts/canary-manifest.json"
          } >> "$GITHUB_OUTPUT"

      - name: Scan Hermes image for vulnerabilities
        id: scan_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_DIGEST_REF }}
          scanners: vuln
          format: json
          output: ${{ steps.prep.outputs.vuln_json_path }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan Hermes image for secrets
        id: scan_secret
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_DIGEST_REF }}
          scanners: secret
          format: json
          output: ${{ steps.prep.outputs.secret_json_path }}
          exit-code: 0

      - name: Enforce fail-closed Trivy policy
        id: enforce_policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_trivy_reports.py \
            --vuln-report "${{ steps.prep.outputs.vuln_json_path }}" \
            --secret-report "${{ steps.prep.outputs.secret_json_path }}"

      - name: Write canary manifest
        id: write_manifest
        if: steps.enforce_policy.outcome == 'success'
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          IMAGE_DIGEST_REF: ${{ needs.build.outputs.image_digest_ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          manifest = {
              'schema_version': 1,
              'workflow': 'hermes-canary-image',
              'source_repository': os.environ['SOURCE_REPOSITORY'],
              'source_sha': os.environ['SOURCE_SHA'],
              'image_repository': os.environ['IMAGE_REPOSITORY'],
              'image_tag': os.environ['IMAGE_REF'],
              'image_digest': os.environ['IMAGE_DIGEST_REF'].split('@', 1)[1],
              'image_digest_ref': os.environ['IMAGE_DIGEST_REF'],
              'workflow_run': {
                  'id': int(os.environ['WORKFLOW_RUN_ID']),
                  'attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
                  'url': os.environ['WORKFLOW_URL'],
              },
              'platforms': ['linux/amd64'],
              'artifacts': {
                  'build_status': 'artifacts/build-status.json',
                  'build_metadata': os.environ['BUILD_METADATA_REF'],
                  'source_dockerfile_sha256': 'artifacts/source-dockerfile.sha256',
                  'hardening_fragment_sha256': 'artifacts/hardening-fragment.sha256',
                  'rendered_dockerfile_sha256': 'artifacts/rendered-dockerfile.sha256',
                  'smoke_status': 'artifacts/smoke-status.json',
                  'sbom_status': 'artifacts/sbom-status.json',
                  'security_status': 'artifacts/security-status.json',
                  'vuln_json': 'artifacts/trivy-vuln.json',
                  'secret_json': 'artifacts/trivy-secret.json',
              },
              'provenance': {
                  'reference': 'artifacts/build-metadata.json',
                  'source_dockerfile_sha256': 'artifacts/source-dockerfile.sha256',
                  'hardening_fragment_sha256': 'artifacts/hardening-fragment.sha256',
                  'rendered_dockerfile_sha256': 'artifacts/rendered-dockerfile.sha256',
              },
              'policy': {
                  'fixable_high_critical': 'zero',
                  'secret_findings': 'zero',
                  'allowlist': [],
              },
          }
          Path('artifacts/canary-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Write security status
        id: write_security_status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          LOGIN_GHCR_OUTCOME: ${{ steps.login_ghcr.outcome }}
          PREP_OUTCOME: ${{ steps.prep.outcome }}
          SCAN_VULN_OUTCOME: ${{ steps.scan_vuln.outcome }}
          SCAN_SECRET_OUTCOME: ${{ steps.scan_secret.outcome }}
          ENFORCE_POLICY_OUTCOME: ${{ steps.enforce_policy.outcome }}
          WRITE_MANIFEST_OUTCOME: ${{ steps.write_manifest.outcome }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          IMAGE_DIGEST_REF: ${{ env.IMAGE_DIGEST_REF }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          outcomes = [
              ('login_ghcr', os.environ['LOGIN_GHCR_OUTCOME']),
              ('prep', os.environ['PREP_OUTCOME']),
              ('scan_vuln', os.environ['SCAN_VULN_OUTCOME']),
              ('scan_secret', os.environ['SCAN_SECRET_OUTCOME']),
              ('enforce_policy', os.environ['ENFORCE_POLICY_OUTCOME']),
              ('write_manifest', os.environ['WRITE_MANIFEST_OUTCOME']),
          ]
          failure_stage = next((name for name, outcome in outcomes if outcome != 'success'), '')
          status = {
              'schema_version': 1,
              'job_name': 'security',
              'job_status': os.environ['JOB_STATUS'],
              'build_job_result': os.environ['BUILD_JOB_RESULT'],
              'failure_stage': failure_stage,
              'image_ref': os.environ['IMAGE_REF'],
              'image_digest_ref': os.environ['IMAGE_DIGEST_REF'],
              'step_outcomes': {name: outcome for name, outcome in outcomes},
              'artifacts': {
                  'manifest': 'artifacts/canary-manifest.json',
                  'status': 'artifacts/security-status.json',
                  'build_metadata': os.environ['BUILD_METADATA_REF'],
                  'vuln_json': 'artifacts/trivy-vuln.json',
                  'secret_json': 'artifacts/trivy-secret.json',
              },
              'provenance': {
                  'reference': os.environ['BUILD_METADATA_REF'],
                  'attestation': 'registry-attestation',
              },
              'policy': {
                  'fixable_high_critical': 'zero',
                  'secret_findings': 'zero',
                  'allowlist': [],
              },
          }
          Path('artifacts/security-status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload security artifacts
        id: upload_security_artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: hermes-canary-image-security-${{ inputs.source_sha }}
          path: |
            artifacts/canary-manifest.json
            artifacts/security-status.json
            artifacts/build-metadata.json
            artifacts/trivy-vuln.json
            artifacts/trivy-secret.json
          if-no-files-found: warn
